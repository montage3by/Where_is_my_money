<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#262624">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>ROW ROW</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="apple-mobile-web-app-title" content="ROW ROW">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <h1>ROW ROW</h1>
    <p class="sub" id="summary"></p>
  </header>

  <nav class="tabs" role="tablist">
    <button role="tab" data-tab="todo" aria-selected="true">Дела</button>
    <button role="tab" data-tab="meals">Рацион</button>
    <button role="tab" data-tab="shop">Покупки</button>
    <button role="tab" data-tab="weight">Вес</button>
    <button role="tab" data-tab="rules">Правила</button>
  </nav>

  <main>
    <section id="tab-todo" class="panel">
      <div class="date-nav">
        <button data-shift="-1" aria-label="Предыдущий день">‹</button>
        <div><div id="todo-date"></div><div class="kcal" id="todo-progress"></div></div>
        <button data-shift="1" aria-label="Следующий день">›</button>
      </div>
      <div id="todo-list"></div>
      <h3 class="cat">История</h3>
      <div class="card history" id="todo-history"></div>
      <a class="link-btn muted" href="/api/export" download>Скачать все данные (JSON)</a>
    </section>

    <section id="tab-meals" class="panel" hidden>
      <div class="days" id="days"></div>
      <div class="card" id="day-card"></div>
      <button class="link-btn" data-reset="meals">Сбросить отметки рациона за неделю</button>
    </section>

    <section id="tab-shop" class="panel" hidden>
      <div class="card stat" id="shop-stat"></div>
      <label class="toggle"><input type="checkbox" id="hide-bought"> Скрыть купленное</label>
      <div id="shop-list"></div>
      <button class="link-btn" data-reset="shopping">Сбросить список покупок</button>
    </section>

    <section id="tab-weight" class="panel" hidden>
      <form class="card weight-form" id="weight-form">
        <label>Дата <input type="date" name="date" required></label>
        <label>Вес, кг <input type="number" name="kg" step="0.1" min="20" max="400" inputmode="decimal" required></label>
        <button type="submit">Записать</button>
      </form>
      <p class="hint">Раз в неделю, утром натощак.</p>
      <ul class="card weights" id="weights"></ul>
    </section>

    <section id="tab-rules" class="panel" hidden>
      <ul class="card rules" id="rules"></ul>
    </section>
  </main>

  <div class="toast" id="toast" hidden></div>
  <script src="app.js"></script>
</body>
</html>
