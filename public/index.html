<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#262624">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Solo Leveling</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="apple-mobile-web-app-title" content="Solo Leveling">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <h1>Solo Leveling</h1>
    <p class="sub" id="summary"></p>
  </header>

  <nav class="tabs" role="tablist">
    <button role="tab" data-tab="todo" aria-selected="true">Дела</button>
    <button role="tab" data-tab="game">Игра</button>
    <button role="tab" data-tab="gym">Тренировки</button>
    <button role="tab" data-tab="meals">Рацион</button>
  </nav>

  <main>
    <section id="tab-todo" class="panel">
      <div class="card game-bar" id="game-bar"></div>
      <div class="card info" id="info" hidden></div>
      <div class="date-nav">
        <button data-shift="-1" aria-label="Предыдущий день">‹</button>
        <div><div id="todo-date"></div><div class="kcal" id="todo-progress"></div></div>
        <button data-shift="1" aria-label="Следующий день">›</button>
      </div>
      <div class="todo-filter" id="todo-filter"></div>
      <div id="todo-list"></div>
      <h3 class="cat">История</h3>
      <div class="card history" id="todo-history"></div>
      <a class="link-btn muted" href="/api/export" download>Скачать все данные (JSON)</a>
    </section>

    <section id="tab-meals" class="panel" hidden>
      <div class="days" id="days"></div>
      <div class="card" id="day-card"></div>
      <h3 class="cat"><span>Съедено на самом деле</span><span id="food-total"></span></h3>
      <div class="card food" id="food-list"></div>
      <form class="card food-form" id="food-form">
        <div class="seg food-meal">
          <label><input type="radio" name="meal" value="Завтрак" checked><span>Завтрак</span></label>
          <label><input type="radio" name="meal" value="Обед"><span>Обед</span></label>
          <label><input type="radio" name="meal" value="Ужин"><span>Ужин</span></label>
          <label><input type="radio" name="meal" value="Перекус"><span>Перекус</span></label>
        </div>
        <input name="text" placeholder="Что съел: йогурт 180 г + 2 банана" maxlength="300" autocomplete="off">
        <div class="food-row">
          <input name="kcal" type="number" inputmode="numeric" min="0" max="5000" placeholder="ккал (если знаешь)">
          <button type="submit">Записать</button>
        </div>
      </form>
      <h3 class="cat">Правила питания</h3>
      <ul class="card rules" id="rules"></ul>
      <button class="link-btn" data-reset="meals">Сбросить отметки рациона за неделю</button>
    </section>

    <section id="tab-gym" class="panel" hidden>
      <div class="card gym-week" id="gym-week"></div>
      <div class="card gym-today" id="gym-today"></div>
      <h3 class="cat"><span>Прогресс</span><span class="kcal">рабочие веса и вес тела</span></h3>
      <div class="gym-chips" id="gym-chips"></div>
      <div class="card gym-progress" id="gym-progress"></div>
      <div id="gym-body" hidden>
        <form class="card weight-form" id="weight-form">
          <div class="dp-field wf-date"><span>Дата</span><input type="hidden" name="date"><button type="button" class="date-btn" data-dp-toggle></button><div class="dp" hidden></div></div>
          <label>Вес, кг <input type="number" name="kg" step="0.1" min="20" max="400" inputmode="decimal" required></label>
          <button type="submit">Записать</button>
        </form>
        <p class="hint">Раз в неделю, утром натощак.</p>
        <ul class="card weights" id="weights"></ul>
      </div>
      <h3 class="cat"><span>Программа</span><span class="kcal">пн–пт, утром</span></h3>
      <div id="gym-program"></div>
    </section>

    <section id="tab-game" class="panel" hidden>
      <div id="game-tab"></div>
    </section>
  </main>

  <dialog id="task-dialog">
    <form id="task-form" novalidate>
      <h2 id="task-dialog-title">Новое дело</h2>
      <label class="field"><span>Название</span><input name="title" maxlength="120" autocomplete="off"></label>
      <div class="row2">
        <label class="field"><span>С</span><input type="time" name="start"></label>
        <label class="field"><span>До</span><input type="time" name="end"></label>
      </div>
      <div class="field"><span>Тип</span>
        <div class="seg">
          <label><input type="radio" name="kind" value="simple" checked><span>Галочка</span></label>
          <label><input type="radio" name="kind" value="subtasks"><span>Подпункты</span></label>
          <label><input type="radio" name="kind" value="counter"><span>Счётчик</span></label>
        </div>
      </div>
      <label class="field" data-kind="subtasks" hidden><span>Подпункты — по одному на строку</span><textarea name="subtasks" rows="4"></textarea></label>
      <label class="field" data-kind="counter" hidden><span>Цель</span><input type="number" name="target" min="1" max="10000" inputmode="numeric"></label>
      <label class="field"><span>Описание</span><textarea name="details" rows="2" maxlength="1000"></textarea></label>
      <div class="row2">
        <label class="field"><span>Характеристика</span>
          <select name="stat">
            <option value="">Авто по названию</option>
            <option value="str">💪 Сила</option>
            <option value="wis">🧠 Интеллект</option>
            <option value="dis">🛡️ Дисциплина</option>
            <option value="foc">🎯 Фокус</option>
            <option value="con">🔥 Уверенность</option>
          </select>
        </label>
        <label class="field"><span>Опыт, XP</span><input type="number" name="xp" min="0" max="500" inputmode="numeric" placeholder="авто (0 — вне игры)"></label>
      </div>
      <div class="field"><span>Когда</span>
        <div class="seg">
          <label><input type="radio" name="when" value="date" checked><span>Один день</span></label>
          <label><input type="radio" name="when" value="once"><span>Пока не сделаю</span></label>
          <label><input type="radio" name="when" value="daily"><span>Каждый день</span></label>
        </div>
      </div>
      <div class="field" data-when-days hidden><span>Дни недели</span>
        <div class="weekdays">
          <label><input type="checkbox" name="days" value="1"><span>Пн</span></label>
          <label><input type="checkbox" name="days" value="2"><span>Вт</span></label>
          <label><input type="checkbox" name="days" value="3"><span>Ср</span></label>
          <label><input type="checkbox" name="days" value="4"><span>Чт</span></label>
          <label><input type="checkbox" name="days" value="5"><span>Пт</span></label>
          <label><input type="checkbox" name="days" value="6"><span>Сб</span></label>
          <label><input type="checkbox" name="days" value="0"><span>Вс</span></label>
        </div>
      </div>
      <div class="field dp-field" data-when-date><span>Дата</span><input type="hidden" name="date"><button type="button" class="date-btn" data-dp-toggle></button><div class="dp" hidden></div></div>
      <p class="form-error" id="task-error" hidden></p>
      <div class="dialog-actions">
        <button type="button" class="danger" data-delete-task hidden>Удалить</button>
        <button type="button" data-close>Отмена</button>
        <button type="submit" class="primary">Сохранить</button>
      </div>
    </form>
  </dialog>

  <dialog id="city-dialog">
    <form id="city-form" novalidate>
      <h2>Город для погоды</h2>
      <input id="city-q" placeholder="Например, Тбилиси" autocomplete="off" enterkeyhint="search">
      <div id="city-results"></div>
      <p class="form-error" id="city-error" hidden></p>
      <div class="dialog-actions"><button type="button" data-city-close>Отмена</button></div>
    </form>
  </dialog>

  <dialog id="img-dialog" class="img-dialog"><img alt="Техника упражнений"></dialog>

  <div class="toast" id="toast" hidden></div>
  <script src="app.js"></script>
  <script src="game.js"></script>
  <script src="gym.js"></script>
</body>
</html>
